<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صانع الجمل</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14213d;--mute:#5b6577;--line:#d9dee6;--main:#0f766e;--main-ink:#fff;--hl:#ffd166;--ok:#15803d;--bad:#b91c1c;--chip:#e7f2f1}
@media (prefers-color-scheme:dark){:root{--bg:#0e1626;--card:#16213a;--ink:#eef2f8;--mute:#9aa6bd;--line:#2a3857;--main:#2dd4bf;--main-ink:#06241f;--hl:#b8860b;--ok:#4ade80;--bad:#f87171;--chip:#1c3a44}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Tajawal",Tahoma,"Segoe UI",sans-serif;line-height:1.7;padding:16px}
main{max-width:760px;margin:0 auto}
h1{font-size:2rem;font-weight:800;margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--main);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.field{margin-bottom:10px}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:10px;border:1px solid var(--main);background:var(--card);color:var(--ink);padding:9px 16px}
button.pri{background:var(--main);color:var(--main-ink)}
button:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.chk{display:flex;gap:6px;align-items:center;font-weight:500}
.chk input{width:auto}
#msg{min-height:1.4em;color:var(--bad);font-weight:500;margin:4px 0}
.ar-sentence{font-size:2.2rem;font-weight:800;text-align:center;padding:14px 4px;line-height:1.5}
.label{color:var(--mute);font-size:.85rem;font-weight:700}
.item{border-inline-start:5px solid var(--main);padding:8px 12px;margin:10px 0;background:var(--bg);border-radius:0 10px 10px 0}
.item.cur{border-inline-start-color:var(--hl);box-shadow:0 0 0 2px var(--hl) inset}
.part{font-size:1.5rem;font-weight:800}
.role{display:inline-block;background:var(--chip);color:var(--ink);border-radius:20px;padding:1px 12px;font-size:.9rem;font-weight:700;margin-inline-start:8px}
.en{direction:ltr;text-align:left;font-size:1.5rem;font-weight:700;font-family:Georgia,"Times New Roman",serif}
mark{background:var(--hl);color:var(--ink);border-radius:4px;padding:0 4px}
.note{color:var(--mute);margin:2px 0 0}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fb{font-weight:700;margin-top:6px}
.fb.good{color:var(--ok)}.fb.no{color:var(--bad)}
.final{text-align:center}
.final .en{text-align:center;font-size:1.8rem}
.tip{background:var(--chip);border-radius:10px;padding:8px 12px;margin-top:10px}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--main);transition:width .3s}
@media(prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>
<main>
<h1>صانع الجمل</h1>
<p class="sub">فكّك الجملة العربية، ثم ابنِ الإنجليزية خطوة بخطوة.</p>

<section class="card" aria-label="الإعدادات">
  <div class="row">
    <div class="field">
      <label for="key">مفتاح Gemini API</label>
      <input id="key" type="password" autocomplete="off" placeholder="الصق المفتاح هنا (يبقى في الذاكرة فقط)">
    </div>
    <div class="field">
      <label for="model">النموذج</label>
      <select id="model">
        <option value="gemini-flash-latest" selected>gemini-flash-latest (الأساسي)</option>
        <option value="gemini-flash-lite-latest">gemini-flash-lite-latest</option>
        <option value="gemini-pro-latest">gemini-pro-latest</option>
        <option value="gemini-2.5-flash">gemini-2.5-flash</option>
        <option value="gemini-2.5-pro">gemini-2.5-pro</option>
        <option value="__custom">اسم نموذج آخر…</option>
      </select>
      <input id="custom" placeholder="اكتب اسم النموذج، مثل gemini-3-flash-preview" style="display:none;margin-top:6px;direction:ltr">
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label for="level">المستوى</label>
      <select id="level"><option>مبتدئ</option><option selected>متوسط</option><option>متقدم</option></select>
    </div>
    <div class="field">
      <label for="focus">نوع الجملة (اختياري)</label>
      <input id="focus" placeholder="مثال: نفي في المضارع، سؤال بـ لماذا، أو موضوع كالسفر">
    </div>
  </div>
  <div class="bar">
    <button class="pri" id="gen">ولّد جملة جديدة</button>
    <label class="chk"><input type="checkbox" id="practice" checked> وضع التدريب (جرّب قبل أن ترى الإجابة)</label>
  </div>
  <div id="msg" role="alert"></div>
</section>

<section id="stage" aria-live="polite"></section>
</main>

<script>
const $ = id => document.getElementById(id);
const ROLES = ["الفاعل","الفعل","المفعول به","أداة النفي","أداة السؤال","حرف جر","ضمير","ظرف","صفة","أداة ربط"];
let S = null; // {d, p, s, solved, fb}

$("model").onchange = () => { $("custom").style.display = $("model").value === "__custom" ? "block" : "none"; };
$("gen").onclick = generate;
$("practice").onchange = () => { if (S) { S.solved = false; S.fb = ""; render(); } };

const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = t => String(t).toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim();
const modelName = () => ($("model").value === "__custom" ? $("custom").value.trim() : $("model").value);

function buildPrompt() {
  const focus = $("focus").value.trim();
  return `أنت معلّم إنجليزية لمتعلم ناطق بالعربية. ولّد جملة عربية واحدة قصيرة وطبيعية (مستوى: ${$("level").value})` +
  (focus ? ` تدور حول: ${focus}.` : ".") + ` غيّر الجملة في كل مرة (مثل: أنا لا أحب الشاي، لماذا لا تأتي معي؟).
أعد JSON فقط بلا أي نص آخر وبلا علامات markdown، بهذا الشكل:
{
 "arabic": "الجملة العربية كاملة",
 "english": "الترجمة الإنجليزية النهائية",
 "parts": [ {"text":"جزء من الجملة العربية بالترتيب", "role":"واحد من: ${ROLES.join("، ")}", "note":"شرح قصير بالعربية لدور الجزء، وإن كان مركّبًا فككه (مثل معي = مع + ياء المتكلم)"} ],
 "steps": [ {"ar":"الجزء العربي المقابل", "so_far":"الجملة الإنجليزية حتى هذه الخطوة", "added":"الكلمات المضافة في هذه الخطوة فقط", "explain":"شرح بالعربية: معنى الجزء، الضمير أو أداة النفي أو الزمن، وكيف يتركب مع ما قبله"} ],
 "tip": "ملاحظة قصيرة بالعربية تلخص القاعدة"
}
شروط: parts تغطي الجملة العربية كلها بالترتيب. steps تبني الإنجليزية تدريجيًا بترتيب الإنجليزية الصحيح، والخطوة الأخيرة so_far فيها تساوي english تمامًا، وكل so_far يحتوي so_far السابق ثم added. استخدم قيمة role من القائمة حرفيًا.`;
}

async function generate() {
  const key = $("key").value.trim(), model = modelName();
  $("msg").textContent = "";
  if (!key) return $("msg").textContent = "أدخل مفتاح API أولًا.";
  if (!model) return $("msg").textContent = "اكتب اسم النموذج.";
  $("gen").disabled = true; $("gen").textContent = "جارٍ التوليد…";
  try {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: "POST",
      headers: {"Content-Type":"application/json","x-goog-api-key":key},
      body: JSON.stringify({
        contents: [{role:"user", parts:[{text: buildPrompt()}]}],
        generationConfig: {responseMimeType:"application/json", temperature:1}
      })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || ("خطأ " + r.status));
    const txt = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").replace(/```json|```/g, "").trim();
    const d = JSON.parse(txt);
    if (!d.arabic || !d.english || !d.parts?.length || !d.steps?.length) throw new Error("الرد ناقص، حاول مرة أخرى.");
    S = {d, p:0, s:0, solved:false, fb:""};
    render();
  } catch (e) {
    $("msg").textContent = "تعذّر التوليد: " + e.message;
  } finally {
    $("gen").disabled = false; $("gen").textContent = "ولّد جملة جديدة";
  }
}

function partHTML(x) {
  return `<div class="item"><span class="part">${esc(x.text)}</span><span class="role">${esc(x.role)}</span><p class="note">${esc(x.note)}</p></div>`;
}
function stepHTML(x, i) {
  return `<div class="item"><div class="label">الخطوة ${i + 1} · ${esc(x.ar)}</div>
  <div class="en">${esc(x.so_far)}</div>
  <p class="note">أُضيف: <mark dir="ltr">${esc(x.added)}</mark></p><p class="note">${esc(x.explain)}</p></div>`;
}

function render() {
  if (!S) return;
  const {d} = S, np = d.parts.length, ns = d.steps.length;
  const practice = $("practice").checked;
  const total = np + ns, at = S.p + S.s;
  let h = `<div class="prog"><i style="width:${Math.round(at / total * 100)}%"></i></div>`;
  h += `<div class="card"><div class="label">الجملة العربية</div><div class="ar-sentence">${esc(d.arabic)}</div></div>`;
  const inParts = S.p < np, inSteps = !inParts && S.s < ns;
  const cur = inParts ? d.parts[S.p] : inSteps ? d.steps[S.s] : null;

  h += `<div class="card"><div class="label">١. تفكيك الجملة العربية</div>`;
  for (let i = 0; i < S.p; i++) h += partHTML(d.parts[i]);
  if (inParts) {
    if (!practice || S.solved) h += `<div class="item cur"><span class="part">${esc(cur.text)}</span><span class="role">${esc(cur.role)}</span><p class="note">${esc(cur.note)}</p></div>`;
    else {
      const opts = ROLES.filter(r => r !== cur.role).sort(() => Math.random() - .5).slice(0, 3).concat(cur.role).sort(() => Math.random() - .5);
      h += `<div class="item cur"><span class="part">${esc(cur.text)}</span><p class="note">ما دور هذا الجزء في الجملة؟</p><div class="choices">` +
        opts.map(o => `<button data-role="${esc(o)}">${esc(o)}</button>`).join("") + `</div></div>`;
    }
  }
  h += `</div>`;

  if (S.p >= np) {
    h += `<div class="card"><div class="label">٢. بناء الجملة الإنجليزية خطوة بخطوة</div>`;
    for (let i = 0; i < S.s; i++) h += stepHTML(d.steps[i], i);
    if (inSteps) {
      if (!practice || S.solved) h += stepHTML(cur, S.s).replace('class="item"', 'class="item cur"');
      else h += `<div class="item cur"><div class="label">الخطوة ${S.s + 1} · الجزء العربي: ${esc(cur.ar)}</div>
        <p class="note">اكتب الجملة الإنجليزية حتى هذه الخطوة${S.s ? " (أكمل على ما سبق: <b dir='ltr'>" + esc(d.steps[S.s - 1].so_far) + "</b>)" : ""}:</p>
        <input id="ans" dir="ltr" autocomplete="off" style="text-align:left" placeholder="اكتب هنا"><div class="bar"><button class="pri" id="chk">تحقق</button><button id="show">أظهر الإجابة</button></div></div>`;
    }
    h += `</div>`;
  }

  if (S.fb) h += `<div class="fb ${S.fbOk ? "good" : "no"}">${esc(S.fb)}</div>`;

  if (cur && (!practice || S.solved)) h += `<div class="bar"><button class="pri" id="next">التالي</button></div>`;
  if (!cur) h += `<div class="card final"><div class="label">الجملة النهائية</div><div class="ar-sentence" style="font-size:1.4rem">${esc(d.arabic)}</div><div class="en">${esc(d.english)}</div>
    ${d.tip ? `<div class="tip">${esc(d.tip)}</div>` : ""}<div class="bar" style="justify-content:center"><button class="pri" id="again">جملة جديدة</button></div></div>`;

  $("stage").innerHTML = h;
  bind();
}

function bind() {
  const q = s => $("stage").querySelector(s);
  $("stage").querySelectorAll("[data-role]").forEach(b => b.onclick = () => {
    if (b.dataset.role === S.d.parts[S.p].role) { S.solved = true; S.fb = "أحسنت!"; S.fbOk = true; }
    else { S.fb = "ليست الإجابة الصحيحة، جرّب خيارًا آخر."; S.fbOk = false; }
    render();
  });
  const chk = q("#chk"), ans = q("#ans");
  if (chk) {
    const go = () => {
      const st = S.d.steps[S.s];
      if (norm(ans.value) === norm(st.so_far)) { S.solved = true; S.fb = "صحيح!"; S.fbOk = true; }
      else { S.fb = "قريب، راجع الجزء المضاف والترتيب ثم أعد المحاولة."; S.fbOk = false; }
      render();
      const a = q("#ans"); if (a) { a.value = ans.value; a.focus(); }
    };
    chk.onclick = go;
    ans.onkeydown = e => { if (e.key === "Enter") go(); };
    ans.focus();
    q("#show").onclick = () => { S.solved = true; S.fb = ""; render(); };
  }
  const nx = q("#next");
  if (nx) nx.onclick = () => { if (S.p < S.d.parts.length) S.p++; else S.s++; S.solved = false; S.fb = ""; render(); nx.blur(); };
  const ag = q("#again"); if (ag) ag.onclick = generate;
}
</script>
</body>
</html>
